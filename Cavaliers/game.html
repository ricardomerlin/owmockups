    * { box-sizing: border-box; }

    body {
      background-color: #1a1a1a;
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif;
    }

    .app-container {
      width: 393px;
      height: 852px;
      background: #000;
      border-radius: 55px;
      box-shadow:
        0 0 0 12px #2c2c2c,
        0 0 0 13px #000,
        0 30px 60px rgba(0,0,0,0.6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* iOS Status Bar */
    .status-bar {
      background: #000;
      color: #fff;
      padding: 14px 20px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      font-size: 15px;
      font-weight: 600;
    }

    .status-bar .time { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }

    .status-bar .icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 34px;
      background: #000;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      box-shadow: 0 0 0 1px #222;
    }

    .dynamic-island .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    /* Nav Bar */
    .nav-bar {
      background: #000;
      color: #fff;
      padding: 8px 16px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
    }

    .nav-back {
      position: absolute;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 4px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    .nav-back svg { width: 10px; height: 16px; }

    .nav-title-img {
      height: 33px;
      width: auto;
      object-fit: contain;
    }

    /* Game Tabs */
    .game-tabs {
      display: flex;
      position: relative;
      background: #000;
      flex-shrink: 0;
      border-bottom: 1px solid #1c1c1c;
    }

    .game-tab {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 12px 0 13px;
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 13.5px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      white-space: nowrap;
      color: #9a9a9a;
      cursor: pointer;
      transition: color 0.2s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .game-tab.active { color: #c8a96e; }

    .tab-count {
      background: #c8a96e;
      color: #000;
      font-family: -apple-system, 'SF Pro Text', Helvetica, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0;
      border-radius: 999px;
      padding: 2px 6px;
      min-width: 18px;
      text-align: center;
      line-height: 1.2;
    }

    .game-tab:not(.active) .tab-count { background: #3a3a3a; color: #ddd; }

    .tab-indicator {
      position: absolute;
      bottom: -1px;
      left: 0;
      height: 3px;
      width: calc(100% / 3);
      background: #c8a96e;
      transition: transform 0.3s ease;
    }

    /* Panes (side-by-side so the conversation module always has real width) */
    .panes-viewport {
      flex-grow: 1;
      overflow: hidden;
      position: relative;
    }

    .panes-track {
      display: flex;
      width: 300%;
      height: 100%;
      transition: transform 0.35s ease;
    }

    .pane {
      width: calc(100% / 3);
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      background: #000;
    }

    .pane::-webkit-scrollbar { display: none; }

    /* Game Header Card */
    .game-card {
      position: relative;
      background:
        repeating-linear-gradient(45deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 6px),
        linear-gradient(180deg, #6e0f33 0%, #4a0a22 100%);
      display: grid;
      grid-template-columns: 1fr 1.6fr 1fr;
      align-items: center;
      padding: 18px 12px 20px;
      color: #fff;
    }

    .game-card.boxed {
      margin: 12px 10px;
      border-radius: 4px;
      border-bottom: 4px solid #c8a96e;
    }

    .game-card .team {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .game-card .team img { width: 50px; height: 50px; object-fit: contain; }

    .game-card .score {
      width: 12px;
      height: 3px;
      background: #fff;
    }

    .game-card .info {
      text-align: center;
      font-size: 13px;
      line-height: 1.45;
      color: #eee;
    }

    .game-card .info strong {
      display: block;
      font-size: 14.5px;
      font-weight: 700;
      color: #fff;
    }

    /* Section Card */
    .section-card {
      margin: 0 10px 12px;
      background: #151515;
      border: 1px solid #222;
      border-radius: 4px;
      padding: 22px 14px 8px;
    }

    .section-title {
      display: inline-block;
      font-family: 'Bebas Neue', 'Oswald', sans-serif;
      font-size: 40px;
      line-height: 0.9;
      letter-spacing: 1px;
      color: #fff;
      padding-bottom: 2px;
      border-bottom: 6px solid #c8a96e;
      margin-bottom: 18px;
    }

    /* Segmented Control */
    .segmented {
      display: flex;
      border: 1px solid #c8a96e;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .segmented button {
      flex: 1;
      background: transparent;
      border: 0;
      border-left: 1px solid #c8a96e;
      color: #c8a96e;
      font-family: 'Oswald', sans-serif;
      font-weight: 500;
      font-size: 15px;
      padding: 8px 0;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .segmented button:first-child { border-left: 0; }

    .segmented button.active {
      background: #c8a96e;
      color: #fff;
    }

    .segmented.large {
      margin: 14px 12px 12px;
      border-radius: 6px;
    }

    .segmented.large button {
      font-size: 17px;
      padding: 10px 0;
    }

    /* Team Leaders */
    .leader {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 0;
      border-bottom: 1px solid #262626;
    }

    .leader:last-child { border-bottom: 0; }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      background: #2a2a2a;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      color: #bbb;
      font-family: 'Oswald', sans-serif;
      font-size: 15px;

    .avatar.cle { border: 2px solid #c8a96e; }

    .ts-row:last-child { border-bottom: 0; }
    .ts-row .l { text-align: left; padding-left: 6px; }
    .ts-row .c { text-align: center; text-transform: uppercase; font-size: 15.5px; }
    .ts-row .r { text-align: right; padding-right: 6px; }

    /* Player Stats Table */
    .players-band {
      background: #1a1a1a;
      text-align: center;
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 14px;
      color: #eee;
      padding: 9px 0;
      border-top: 1px solid #262626;
      border-bottom: 1px solid #262626;
    }

    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .table-scroll::-webkit-scrollbar { display: none; }

    table.stats {
      border-collapse: collapse;
      min-width: 100%;
      font-size: 15px;
      color: #d8d8d8;
      white-space: nowrap;

    table.stats th {

      font-weight: 600;
      font-size: 14.5px;
      color: #fff;
      padding: 12px 10px;
      text-align: center;
    }

    table.stats td {

    table.stats tbody tr:nth-child(odd) td { background: #161616; }
    table.stats tbody tr:nth-child(even) td { background: #212121; }

    table.stats .sticky {
      position: sticky;
      left: 0;
      z-index: 2;
      text-align: left;
      padding-left: 0;
    }

    table.stats th.sticky { z-index: 3; }

    .player-cell {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 196px;
    }

    .player-cell .num {
      width: 32px;
      flex-shrink: 0;
      text-align: center;
      color: #fff;
      font-weight: 600;
      font-size: 15px;
    }

    .player-cell .mini {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      background: #333;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      font-size: 10px;

    .player-cell .mini img { width: 140%; height: auto; }

    .player-cell .pname {
      color: #fff;

      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Conversation Tab */
    .convo-intro {
      margin: 0 10px 4px;
      padding: 14px 14px 4px;
    }

    .convo-intro .section-title { margin-bottom: 10px; }

    .convo-intro p {
      margin: 0;
      color: #9a9a9a;
      font-size: 14px;
      line-height: 1.45;
    }

    .convo-wrap {
      padding: 0 10px 24px;
    }

    /* Bottom Navigation */
    .bottom-nav {
      background: #000;
      border-top: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 8px 0 20px;
      flex-shrink: 0;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      width: 60px;
      gap: 4px;
      color: #888;
      font-size: 10px;
      cursor: pointer;
      text-align: center;
    }

    .nav-item svg,
    .nav-item img {
      width: 24px;
      height: 24px;
      display: block;
    }

    .nav-item svg {
      stroke: #888;
      fill: none;
    }

    .nav-item.active { color: #c8a96e; }
    .nav-item.active svg { stroke: #c8a96e; }
    .nav-item.active svg rect[fill] { fill: #c8a96e; }

    .nav-item span {
      display: block;
      line-height: 1;
      margin-top: 2px;
    }

    .cavs-gray-icon {
      filter: brightness(0) invert(55%);
    }

    @media (max-width: 768px) {
      body { background: #000; }
      .app-container {
        width: 100%;
        height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
    }

  </style>
</head>

<script>
  var LOGOS = {
    bos: 'https://cdn.nba.com/logos/nba/1610612738/primary/L/logo.svg',

    return 'https://cdn.nba.com/headshots/nba/latest/260x190/' + id + '.png';
  }

  // Falls back to initials when a headshot is missing
  function avatarInner(p) {
    var initials = p.name.split(' ').map(function (w) { return w[0]; }).join('').slice(0, 2);

<script>
  (function () {
    'use strict';
  
    // ==== EDIT THESE ====
    var AD_IMAGES = [
      'https://www.spotim.name/ricardo/cavs/images/healthessentials.jpeg',
      'https://www.spotim.name/ricardo/cavs/images/seatgeek.jpeg'
    ];
    var AD_CLICK_URL = '';        // optional — leave blank for a non-clickable image
    var EVERY_N_COMMENTS = 3;     // insert after every Nth comment
    var MAX_WIDTH = 728;          // caps the creative's width; height follows each image's own ratio
    // =====================
  
    var ADCHOICES_ICON_SRC = 'https://www.spotim.name/ricardo/financialtimes/ad-choices.png';
  
    // Guards against the script accidentally being included twice on the same page.
    if (window.__owInConvoAdsInit) return;
    window.__owInConvoAdsInit = true;
  
    var MARK_ATTR = 'data-ow-incovo-ad';
  
    // Random — each ad slot picks any creative from AD_IMAGES independently, so the same image
    // can land in back-to-back slots. The pick happens once per slot (MARK_ATTR stops a slot from
    // being rebuilt), so an ad never swaps images while the reader is looking at it.
    function pickAdImageForSlot() {
      return AD_IMAGES[Math.floor(Math.random() * AD_IMAGES.length)];
    }
  
    // The real comment items (.spcv_list-item) render inside the OpenWeb widget's own OPEN
    // shadow root, so a plain document.querySelectorAll() never sees them — this walks into
    // every open shadow root it finds, recursively, the same way the widget's own internals do.
    function deepQueryAll(root, selector) {
      var found = [];
      (function walk(node) {
        if (!node || !node.querySelectorAll) return;
        node.querySelectorAll(selector).forEach(function (el) { found.push(el); });
        node.querySelectorAll('*').forEach(function (el) {
          if (el.shadowRoot) walk(el.shadowRoot);
        });
      })(root);
      return found;
    }
  
    // Every style is set inline with `all:initial` first — this unit can land inside the
    // widget's own shadow root, which never inherits the host page's <style> tags. No fixed
    // width/height on the <img> itself since the two source images are different aspect ratios;
    // only the container's width is capped, height follows naturally.
    function buildAdUnit(slotIndex) {
      var font = '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
  
      var unit = document.createElement('div');
      unit.setAttribute('style', 'all:initial;display:block;box-sizing:border-box;width:100%;max-width:' + MAX_WIDTH + 'px;margin:16px auto;font-family:' + font + ';');
  
      var creative = document.createElement(AD_CLICK_URL ? 'a' : 'div');
      creative.setAttribute('style', 'all:initial;display:block;box-sizing:border-box;width:100%;border:1px solid #e4ddd3;background:#f4efe8;border-radius:4px;overflow:hidden;');
      if (AD_CLICK_URL) {
        creative.href = AD_CLICK_URL;
        creative.target = '_blank';
        creative.rel = 'noopener sponsored';
      }
  
      var img = document.createElement('img');
      img.setAttribute('style', 'all:initial;display:block;width:100%;height:auto;');
      img.src = pickAdImageForSlot(slotIndex);
      img.alt = 'Advertisement';
      creative.appendChild(img);
  
      var footer = document.createElement('div');
      footer.setAttribute('style', 'all:initial;display:flex;align-items:center;justify-content:space-between;box-sizing:border-box;width:100%;padding:6px 2px 0;font-size:11px;font-family:' + font + ';color:#6b7280;');
  
      var adchoices = document.createElement('span');
      adchoices.setAttribute('style', 'all:initial;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-family:' + font + ';color:#6b7280;');
      adchoices.appendChild(document.createTextNode('AdChoices'));
      var icon = document.createElement('img');
      icon.setAttribute('style', 'all:initial;display:inline-block;width:13px;height:13px;');
      icon.src = ADCHOICES_ICON_SRC;
      icon.alt = 'AdChoices';
      adchoices.appendChild(icon);
  
      var sponsored = document.createElement('span');
      sponsored.setAttribute('style', 'all:initial;display:inline-block;font-size:11px;font-family:' + font + ';color:#6b7280;');
      sponsored.textContent = 'Sponsored';
  
      footer.appendChild(adchoices);
      footer.appendChild(sponsored);
  
      unit.appendChild(creative);
      unit.appendChild(footer);
      return unit;
    }
  
    // Appended as the LAST CHILD of every Nth comment item itself (not inserted as a sibling
    // between items) — sitting inside the item's own box is what keeps the real widget's list
    // rendering/virtualization from fighting with an injected sibling node. slotIndex always
    // advances once per ad POSITION on the page (even for a slot already handled on an earlier
    // tick), never once per actual insertion — that's what keeps the alternation tied to where
    // an ad sits on the page rather than to insertion timing/order. Idempotent via MARK_ATTR, so
    // re-running this on a timer (comments load in via infinite scroll) never double-inserts
    // into an item it's already handled.
    function insertAds() {
      var items = deepQueryAll(document, '.spcv_list-item');
      var slotIndex = 0;
      for (var i = EVERY_N_COMMENTS - 1; i < items.length; i += EVERY_N_COMMENTS) {
        var item = items[i];
        if (item && !item.hasAttribute(MARK_ATTR)) {
          item.setAttribute(MARK_ATTR, '');
          item.appendChild(buildAdUnit(slotIndex));
        }
        slotIndex++;
      }
    }
  
    insertAds();
    setInterval(insertAds, 2000); // re-checks as more comments load in
  })();
  </script>
