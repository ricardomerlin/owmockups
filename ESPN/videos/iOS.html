    <script>

    <style>
        /* --- DESKTOP / SIMULATOR STYLES (Default) --- */
        body {
            background-color: #1a1a1a; 
            margin: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; 
        }

        /* The "Locked" iPhone Device Container */
        .app-container {
            position: relative;
            width: 393px; 
            height: 852px;
            
            background: #000;
            border-radius: 55px; 
            box-shadow: 
                0 0 0 12px #2c2c2c, 
                0 0 0 13px #000,   
                0 30px 60px rgba(0,0,0,0.6); 
            
            overflow: hidden; 
            display: flex;
            flex-direction: column;

            max-width: 95vw;
            max-height: 95vh;
            aspect-ratio: 393 / 852;
        }

        .content-area {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            /* Removed border-radius here to make video corners square */
        }

        /* --- MOBILE OVERRIDES (Real Device View) --- */
        @media (max-width: 768px) {
            body {
                background-color: #000; /* Match app bg, hide grey body */
            }

            .app-container {
                /* Unlock dimensions to fill the real screen */
                width: 100%;
                height: 100dvh; /* Dynamic Viewport Height */
                max-width: none;
                max-height: none;
                aspect-ratio: auto;
                
                /* Remove "Fake Phone" styling */
                border-radius: 0;
                box-shadow: none;
                border: none;
            }
        }

        /* --- SHARED STYLES --- */
        .reels-container::-webkit-scrollbar {
            display: none;
        }
        .reels-container {
            -ms-overflow-style: none;
            scrollbar-width: none;
            scroll-snap-type: y mandatory;
        }

        .video-item {
            scroll-snap-align: start;
            height: 100%; 
            position: relative;
            overflow: hidden;
            width: 100%; 
        }
        .video-player {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Safe Area Padding for Bottom Nav (Handles iPhone Home Bar) */
        .safe-pb {
            padding-bottom: 20px; /* Default for desktop/older phones */
            padding-bottom: env(safe-area-inset-bottom, 20px); /* For iPhone X+ */
        }
    </style>
</head>
<body class="text-white">

    <div class="app-container">
        
        <div class="absolute top-0 left-0 right-0 z-20 pt-12 pb-4 bg-gradient-to-b from-black/60 to-transparent">
            <div class="flex justify-center items-center space-x-6 text-sm font-medium tracking-wide">
                <span class="text-gray-400 cursor-pointer">SC For You</span>
                <div class="flex flex-col items-center cursor-pointer">
                    <span class="text-white font-bold">Discover</span>
                    <div class="h-1 w-8 bg-white mt-1 rounded-full"></div>
                </div>
                <span class="text-gray-400 cursor-pointer">Following</span>
            </div>
        </div>

        <div class="content-area">
            <div id="reels-container" class="reels-container h-full overflow-y-scroll">
                </div>
        </div>

        <div class="h-20 bg-nav-bg border-t border-gray-800 flex justify-around items-center px-2 safe-pb z-30" style="padding-top: 5px;">
            <div class="flex flex-col items-center justify-center space-y-1 w-1/5 text-gray-500 cursor-pointer hover:text-white transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-[10px]">Home</span>
            </div>
            <div class="flex flex-col items-center justify-center space-y-1 w-1/5 text-gray-500 cursor-pointer hover:text-white transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                <span class="text-[10px]">Scores</span>
            </div>
            <div class="flex flex-col items-center justify-center space-y-1 w-1/5 text-gray-500 cursor-pointer hover:text-white transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span class="text-[10px]">Watch</span>
            </div>
            <div class="flex flex-col items-center justify-center space-y-1 w-1/5 text-white cursor-pointer">
                <div class="bg-white text-black rounded-md p-0.5">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/></svg> </div>
                <span class="text-[10px] font-bold">Verts</span>
            </div>
            <div class="flex flex-col items-center justify-center space-y-1 w-1/5 text-gray-500 cursor-pointer hover:text-white transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                <span class="text-[10px]">More</span>
            </div>
        </div>

        <div id="notification-box" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/70 text-white px-6 py-3 rounded-xl shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none z-50 backdrop-blur-sm">
            Action Performed!
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('reels-container');
            const notificationBox = document.getElementById('notification-box');

            // --- Mock Data ---
            const videosData = [
                {
                    id: 1,
                    url: "https://www.spotim.name/ricardo/mockups/espn/videos/This+pass.mp4",
                    username: "NBA",
                    caption: "This pass 😮‍💨",
                    timeAgo: "22m",
                    likes: 129,
                    comments: 42,
                    shares: 23,
                    liked: false,
                    profilePic: "https://upload.wikimedia.org/wikipedia/en/0/03/National_Basketball_Association_logo.svg" 
                },
                {
                    id: 2,
                    url: "https://www.spotim.name/ricardo/mockups/espn/videos/Arch+Mannings+FULL+ON+LEVEL+UP+MOMENT!+%40CHEEZIT.mp4",
                    username: "NFL",
                    caption: "Arch Manning is on another level!",
                    timeAgo: "1h",
                    likes: 3407,
                    comments: 89,
                    shares: 412,
                    liked: true,
                    profilePic: "https://upload.wikimedia.org/wikipedia/en/a/a2/National_Football_League_logo.svg"
                },
                {
                    id: 3,
                    url: "https://www.spotim.name/ricardo/mockups/espn/videos/This+is+great++(via+%40sageandsunsoapsTT).mp4",
                    username: "NBA",
                    caption: "These filters! 😂",
                    timeAgo: "3h",
                    likes: 45210,
                    comments: 1250,
                    shares: 1200,
                    liked: false,
                    profilePic: "https://upload.wikimedia.org/wikipedia/en/0/03/National_Basketball_Association_logo.svg"
                },
            ];

            // --- Utility Functions ---

            function showNotification(message) {
                notificationBox.textContent = message;
                notificationBox.classList.remove('opacity-0', 'pointer-events-none');
                notificationBox.classList.add('opacity-100');
                setTimeout(() => {
                    notificationBox.classList.remove('opacity-100');
                    notificationBox.classList.add('opacity-0', 'pointer-events-none');
                }, 1500);
            }

            // --- INTERSECTION OBSERVER (Fixed for Autoplay) ---
            const observerOptions = {
                root: container, 
                threshold: 0.6   
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    if (!video) return;

                    if (entry.isIntersecting) {
                        // FIX: Mute FIRST, then Play.
                        // Browsers block autoplay unless the video is muted.
                        if (video.hasAttribute('data-muted-on-start')) {
                            video.muted = true;
                            video.removeAttribute('data-muted-on-start');
                        }
                        
                        // Attempt to play
                        var playPromise = video.play();
                        if (playPromise !== undefined) {
                            playPromise.catch(error => {
                                console.log("Autoplay prevented:", error);
                                // If it failed, ensure it's muted and try one more time
                                video.muted = true;
                                video.play();
                            });
                        }
                    } else {
                        video.pause();
                        video.currentTime = 0;
                    }
                });
            }, observerOptions);

            function getHeartSVG(liked) {
                const fill = liked ? 'currentColor' : 'none';
                const color = liked ? 'text-red-500' : 'text-white';
                return `
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 ${color} transition-transform duration-200 transform active:scale-90" fill="${liked ? '#ef4444' : 'none'}" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                    </svg>
                `;
            }

            function toggleLike(videoId) {
                const videoData = videosData.find(v => v.id === videoId);
                if (!videoData) return;
                const card = document.getElementById(`video-card-${videoId}`);
                const likeButton = card.querySelector('.like-button');
                const likeCountElement = card.querySelector('.like-count');

                videoData.liked = !videoData.liked;
                videoData.likes += videoData.liked ? 1 : -1;
                
                likeCountElement.textContent = formatCount(videoData.likes);
                likeButton.innerHTML = getHeartSVG(videoData.liked);
                showNotification(videoData.liked ? "Liked!" : "Unliked");
            }

            function toggleComments(videoId) {
                const wrapper = document.getElementById(`comments-drawer-wrapper-${videoId}`);
                const drawer = document.getElementById(`comments-drawer-${videoId}`);
                
                if (wrapper.style.display === 'none') {
                    // Open
                    // Lock main container scroll
                    container.style.overflow = 'hidden';
                    
                    wrapper.style.display = 'block';
                    wrapper.classList.remove('pointer-events-none', 'bg-transparent');
                    wrapper.classList.add('bg-black/60');
                    setTimeout(() => {
                        drawer.classList.remove('translate-y-full');
                        drawer.classList.add('translate-y-0');
                    }, 10);
                } else {
                    // Close
                    drawer.classList.remove('translate-y-0');
                    drawer.classList.add('translate-y-full');
                    setTimeout(() => {
                        wrapper.classList.add('pointer-events-none', 'bg-transparent');
                        wrapper.classList.remove('bg-black/60');
                        wrapper.style.display = 'none';
                        
                        // Unlock main container scroll
                        container.style.overflow = ''; 
                    }, 300);
                }
            }

            function formatCount(num) {
                if (num === 0) return "0";
                if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
                if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
                return num.toString();
            }

            function renderVideoCard(video) {
                const videoItem = document.createElement('div');
                videoItem.id = `video-card-${video.id}`;
                videoItem.className = 'video-item bg-black';

                videoItem.innerHTML = `
                    <video class="video-player" loop preload="auto" playsinline data-muted-on-start>
                        <source src="${video.url}" type="video/mp4">
                    </video>

                    <div class="absolute inset-x-0 bottom-0 h-1/2 bg-gradient-to-t from-black/90 via-black/40 to-transparent pointer-events-none z-10"></div>

                    <div class="absolute inset-0 flex flex-col justify-end z-20">
                        <div class="flex items-end pb-8 px-4">
                            <div class="flex-grow pr-12 text-white">
                                <div class="flex items-center space-x-2 mb-2">
                                    <div class="w-6 h-auto bg-blue-700 rounded-sm overflow-hidden flex items-center justify-center">
                                        <img src="${video.profilePic}" class="w-full h-full object-cover">
                                    </div>
                                    <span class="font-bold text-sm tracking-wide">${video.username}</span>
                                    <span class="text-xs text-gray-400">•</span>
                                    <span class="text-xs text-gray-300">${video.timeAgo}</span>
                                </div>
                                <p class="text-base font-medium leading-tight line-clamp-2 text-shadow-sm mb-1">
                                    ${video.caption}
                                </p>
                            </div>

                            <div class="flex flex-col items-center space-y-6 pb-2">
                                <div class="flex flex-col items-center cursor-pointer like-button pointer-events-auto" onclick="toggleLike(${video.id})">
                                    ${getHeartSVG(video.liked)}
                                    <span class="text-xs font-semibold mt-1 like-count">${formatCount(video.likes)}</span>
                                </div>
                                
                                <div class="flex flex-col items-center cursor-pointer pointer-events-auto" onclick="toggleComments(${video.id})">
                                    <svg class="w-8 h-8 text-white mb-1" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
                                        <path fill-rule="evenodd" clip-rule="evenodd" d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 13.5997 2.37562 15.1116 3.04346 16.4525C3.22094 16.8088 3.28001 17.2161 3.17712 17.6006L2.58151 19.8267C2.32295 20.793 3.20701 21.677 4.17335 21.4185L6.39939 20.8229C6.78393 20.72 7.19121 20.7791 7.54753 20.9565C8.88837 21.6244 10.4003 22 12 22ZM8 11C8 10.4477 8.44772 10 9 10H15C15.5523 10 16 10.4477 16 11C16 11.5523 15.5523 12 15 12H9C8.44772 12 8 11.5523 8 11ZM8 15C8 14.4477 8.44772 14 9 14H12C12.5523 14 13 14.4477 13 15C13 15.5523 12.5523 16 12 16H9C8.44772 16 8 15.5523 8 15Z" />
                                    </svg>
                                    <span class="text-xs font-semibold mt-1">${formatCount(video.comments)}</span>
                                </div>
                                <div class="flex flex-col items-center cursor-pointer pointer-events-auto">
                                    <img src="./images/share-solid-full.svg" class="w-8 h-8 filter" />
                                    <span class="text-xs font-semibold mt-1">${formatCount(video.shares)}</span>
                                </div>

                            </div>
                        </div>

                        <div class="w-full h-1 bg-gray-600/50 relative">
                            <div class="absolute h-full bg-white w-1/3 left-0"></div>
                        </div>
                    </div>

                    <div id="comments-drawer-wrapper-${video.id}" class="absolute inset-0 z-40 transition-colors duration-300 pointer-events-none bg-transparent" style="display: none;">
                        <div id="comments-drawer-${video.id}" class="absolute bottom-0 w-full h-[70vh] bg-nav-bg shadow-2xl flex flex-col text-white transform translate-y-full transition-transform duration-300">
                            <div class="flex-grow overflow-y-auto p-4" data-spotim-module="conversation" data-post-id="${video.id}" data-post-url="https://www.spotim.name/ricardo/mockups/espn/iOS.html" data-theme="dark"></div>
                        </div>
                    </div>
                `;
                
                container.appendChild(videoItem);
                
                // --- Attach Click Away Listener ---
                const wrapper = videoItem.querySelector(`#comments-drawer-wrapper-${video.id}`);
                wrapper.addEventListener('click', (e) => {
                    // Close only if clicking the background wrapper
                    if (e.target === wrapper) {
                        toggleComments(video.id);
                    }
                });

                // --- Attach Observer ---
                observer.observe(videoItem);

                const videoEl = videoItem.querySelector('video');
                let lastClick = 0;
                videoEl.addEventListener('click', (e) => {
                    const now = new Date().getTime();
                    if (now - lastClick < 300) {
                        toggleLike(video.id);
                    } else {
                        videoEl.muted = !videoEl.muted;
                    }
                    lastClick = now;
                });
            }

            // Init
            window.toggleLike = toggleLike;
            window.toggleComments = toggleComments;
            videosData.forEach(renderVideoCard);

        });
    </script>
</body>
</html>
