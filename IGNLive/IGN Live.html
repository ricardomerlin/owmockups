<script>
  document.addEventListener('DOMContentLoaded', () => {
      const targetForConversation = document.getElementsByClassName('charity')[0];

      if (!targetForConversation) return;

      const container = document.createElement('div');
      container.style.width = '100%';
      container.style.display = 'flex';
      container.style.justifyContent = 'center';
      container.style.marginTop = '20px';

      const conversation = document.createElement('div');
      conversation.setAttribute('data-spotim-module', 'conversation');
      conversation.setAttribute('data-theme', 'dark');
      conversation.setAttribute('data-messages-count', '5');

      const styles = {
          subtleTransparent: {
              backgroundColor: 'rgba(255, 255, 255, 0.1)',
              borderRadius: '8px',
              // padding: '15px',
              width: '100%',
              maxWidth: '850px',
              color: '#f1e9e7',
              fontSize: '14px',
              backdropFilter: 'blur(100px)',
              border: '1px solid rgba(255, 255, 255, 0.3)',
              paddingLeft: '25px',
              paddingRight: '25px',
              marginRight: '10px',
              marginLeft: '10px'
          }
      };

      const selectedStyle = styles.subtleTransparent;

      Object.assign(conversation.style, selectedStyle);

      container.appendChild(conversation);
      targetForConversation.insertAdjacentElement('beforebegin', container);
  });
</script>
